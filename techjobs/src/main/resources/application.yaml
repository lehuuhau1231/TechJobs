server:
 port: 8080
 servlet:
   context-path: /techJobs

spring:
 config:
   import: optional:file:.env[.properties]
 datasource:
   url: "jdbc:mysql://localhost:3306/techjobdb"
   username: ${DB_USERNAME}
   password: ${DB_PASSWORD}
 jpa:
   hibernate:
     ddl-auto: update
   show-sql: true
 servlet:
   multipart:
     max-file-size: 10MB
     max-request-size: 10MB
     enabled: true
 mail:
   host: smtp.gmail.com
   port: 587
   username: lehuuhau1231@gmail.com
   password: ${email-app-password}
   properties:
     mail:
       smtp:
         auth: true
         starttls:
           enable: true
 data:
   redis:
     host: localhost
     port: 6379
 cache:
   type: redis
   redis:
     time-to-live: 20m 
