 ai:
   openai:
     base-url: http://127.0.0.1:1234
     api-key: test
     chat:
       options:
         model: google/gemma-4-e2b
     embedding:
       options:
         model: text-embedding-nomic-embed-text-v1.5

jwt:
 signerKey: ${signerKey}

cloudinary:
 cloud-name: ${cloud-name}
 api-key: ${cloud-api-key}
 api-secret: ${cloud-api-secret}
 secure: true

vnpay:
 version: "2.1.0"
 TmnCode: ${tmn-code}
 HashSecret: ${hash-secret}
 payUrl: "https://sandbox.vnpayment.vn/paymentv2/vpcpay.html"
 returnUrl: ${returnUrl}
 ipnUrl: ${ipnUrl}
 orderType: "billpayment"
 locale: "vn"

address:
 provincesUrl: ${provincesUrl}
 districtsUrl: ${districtsUrl}

gemini:
 api:
   key: ${gemini-api-key}

embedding:
 type: "FLOAT32"
 dimension: 768
 distance-metric: "COSINE"
 model: "gemini-embedding-001"
